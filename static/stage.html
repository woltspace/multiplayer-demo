<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lodge Show · the page they're building</title>
<link rel="stylesheet" href="static/show.css">
<style>
/* The staged shell: prebuilt. The wolts only fill their own box; the host writes the header at the end. */
body{background:var(--cream);color:var(--ink);font:17px/1.45 DMSans,system-ui;min-height:100vh}
.top{position:relative;padding:16px 24px;background:var(--org);color:#fff;border-bottom:5px solid var(--ink)}
.top h1{font:400 38px/1.05 Preahvihear;margin:0}.top small,.top p{font:700 14px JB;opacity:.92;margin:4px 0 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:20px 24px}
section[data-part]{position:relative;background:#fff;border:4px solid var(--ink);border-radius:16px;box-shadow:8px 8px 0 var(--m);min-height:60vh;min-width:0}
.owner{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:3px solid var(--ink);background:#f3e6c9;font:700 13px JB;border-radius:12px 12px 0 0;flex-wrap:wrap}
.owner b{color:var(--m)}.owner .file{margin-left:auto;color:var(--muted);font-weight:400}
.owner .dot{width:10px;height:10px;border-radius:50%;background:var(--m);display:inline-block}
[data-editing] .owner .dot{animation:blink .6s infinite}
.part-body{padding:16px 18px;overflow:hidden}
.waiting{color:var(--muted);font:700 15px JB;text-align:center;padding:18vh 10px}
.presence{position:absolute;pointer-events:none;border:3px solid var(--m);border-radius:10px;background:color-mix(in srgb,var(--m) 12%,transparent);transition:opacity .8s;z-index:30}
.presence.out{opacity:0}
.presence .who{position:absolute;left:-3px;top:-26px;background:var(--m);color:#fff;font:700 13px JB;padding:3px 9px;border-radius:7px 7px 7px 0;white-space:nowrap}
.presence .caret{position:absolute;right:6px;bottom:6px;width:3px;height:20px;background:var(--m);animation:blink .5s infinite}
.top .presence .who{background:var(--ink)}
@media (max-width:760px){.grid{grid-template-columns:1fr;padding:14px 12px}.top{padding:14px 16px}.top h1{font-size:28px}section[data-part]{min-height:auto}}
</style>
<link rel="stylesheet" href="static/arcade.css?v=7" id="arcade"><script>if(/[?&]classic/.test(location.search))document.getElementById("arcade").remove();
(()=>{const F=["jb","vt","pixel"],q=new URLSearchParams(location.search).get("font");let f=q;try{f=f||localStorage.getItem("show-font")}catch(e){}
document.documentElement.dataset.font=F.includes(f)?f:"pixel";
addEventListener("keydown",e=>{if(e.key!=="f"||e.target.closest("input,textarea,[contenteditable]"))return;const d=document.documentElement,n=F[(F.indexOf(d.dataset.font)+1)%F.length];d.dataset.font=n;try{localStorage.setItem("show-font",n)}catch(_){}});})()</script>
</head>
<body>
<header class="top" id="host" data-part="host" data-c="host"><div class="part-body"><h1>Lodge Show</h1><small>built live by 3 wolts · watch them work</small></div></header>
<script>if (new URLSearchParams(location.search).get("phone") || location.pathname.replace(/\/+$/, "") === "") document.querySelector("header.top .part-body").innerHTML = '<div class="splash"><div class="k">★ LODGE SHOW ★</div><h2>Dam Builders</h2><p>3 humans · 3 wolts · 1 game</p><p class="live">built live, right here</p><p class="hint">watch the big screen</p></div>';</script>
<div class="grid">
  <section class="empty" id="part-a" data-part="p1" data-c="p1"><div class="owner"><span class="dot"></span><span class="nm">Player 1</span><span class="file">part-a.html</span></div><div class="part-body"><div class="waiting">Player 1's wolt builds here…</div></div></section>
  <section class="empty" id="part-b" data-part="p2" data-c="p2"><div class="owner"><span class="dot"></span><span class="nm">Player 2</span><span class="file">part-b.html</span></div><div class="part-body"><div class="waiting">Player 2's wolt builds here…</div></div></section>
</div>
<script>
// ?only=p1 (or p2): just that player's game, edge to edge, for its lane on the big screen. No header, no owner bar.
const ONLY = new URLSearchParams(location.search).get("only");
// Keys from the big screen: /world forwards game keys (arrows, WASD, space, Enter) so the woltPhone plays from the
// keyboard without clicking into it first. Re-dispatched as real keydown/keyup events on this page.
addEventListener("message", (m) => {
  const d = m.data || {};
  if (d.type !== "lodge-key" || typeof d.key !== "string") return;
  // One event from the focused element (or body); it bubbles to document and window, where games listen.
  (document.activeElement || document.body).dispatchEvent(new KeyboardEvent(d.up ? "keyup" : "keydown", {key: d.key, code: d.code || "", bubbles: true}));
});
// The audience page: at the site root (/) the stage IS the game for each phone in the room: the woltPhone layout.
const AUDIENCE = location.pathname.replace(/\/+$/, "") === "" ;
// ?phone=1: the woltPhone (wPhone). The whole shared page, sections stacked (title, Player 1, Player 2), no chrome around them.
if (new URLSearchParams(location.search).get("phone") || AUDIENCE) document.documentElement.classList.add("only", "phone");
// No chat here on purpose: the chat is on the big screen. The audience just watches the game get built, live on every
// save, and plays it.
if (ONLY) {
  document.documentElement.classList.add("only");
  document.querySelectorAll("[data-part]").forEach((el) => { if (el.dataset.part !== ONLY) el.remove(); });
  document.querySelectorAll(".waiting").forEach((el) => el.textContent = "the game appears here…");
}
</script>
<style>
html.only body{background:#fff8e6!important;min-height:0;padding-top:44px}
html.only .grid{display:block;padding:0}
html.only section[data-part]{border:0!important;border-radius:0;box-shadow:none!important;min-height:100vh;background:#fff8e6}
html.only .owner{display:none}
html.phone .top{background:#fff8e6!important;color:#18100a!important;border:0!important;box-shadow:none!important;padding:0!important}
html.phone .top .part-body>h1{font:400 30px/1.05 Preahvihear!important;color:#c4531e!important;text-shadow:none!important}
html.phone .top h1::after{display:none!important}
html.phone .top .part-body>small,html.phone .top .part-body>p{font:14px/1.4 DMSans!important;color:#18100a!important;text-transform:none!important;letter-spacing:0!important}
html.phone section[data-part]{min-height:0!important;margin:0 0 6px}
html.phone .part-body{padding:8px 18px}
html.phone .waiting{padding:18px 10px!important}
html.only .waiting{font-size:13px!important;line-height:1.8!important;padding:30vh 16px!important;white-space:normal}
/* The phone: a player's box shows only once their wolt has put something in it (no empty "Player 1" boxes to
   scroll past). Before the game, one start screen fills the phone. */
html.phone section[data-part].empty{display:none}
html.phone .splash{min-height:calc(100vh - 140px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:0 12px}
html.phone .splash .k{font:400 12px Pixel,monospace;color:#c4531e;letter-spacing:2px}
html.phone .splash h2{margin:0;font:400 34px/1.15 Pixel,monospace;color:#c4531e;text-shadow:3px 3px 0 #18100a22}
html.phone .splash p{margin:0!important;font:15px/1.4 DMSans,sans-serif!important;color:#18100a!important;text-transform:none!important;letter-spacing:0!important}
html.phone .splash .live{font:400 13px Pixel,monospace;color:#18100a;animation:breathe 1.6s ease-in-out infinite alternate}
html.phone .splash .hint{font:700 13px JB,monospace;color:#8a7a68}
@keyframes breathe{from{opacity:.45}to{opacity:1}}
</style>
<!-- The built-in controller: a d-pad and an A button, stuck to the bottom of every copy of the page. They send the
     same keys as a keyboard (arrows, space), so games only handle keys, and the big screen plays them too. -->
<div class="lpad" id="lpad"><div class="dpad"><button data-k="ArrowUp" aria-label="up">▲</button><button data-k="ArrowLeft" aria-label="left">◀</button><button data-k="ArrowRight" aria-label="right">▶</button><button data-k="ArrowDown" aria-label="down">▼</button></div><button class="abtn" data-k=" " aria-label="A">A</button></div>
<style>
/* The controller has its own strip below the content (never on top of it): the page scrolls above it. */
html,body{height:100%}
body{display:flex;flex-direction:column}
#lscroll{flex:1;min-height:0;overflow-y:auto}
.lpad{flex:none;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:6px 22px 8px;background:#18100a}
.lpad .dpad{display:grid;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(2,34px);gap:3px}
.lpad button{font:20px sans-serif;color:#18100a;background:#fff8e6;border:3px solid #000;border-radius:10px;box-shadow:0 4px 0 #c4531e;touch-action:manipulation;user-select:none;-webkit-user-select:none;padding:0}
.lpad button.on{transform:translateY(3px);box-shadow:0 1px 0 #c4531e}
.lpad [data-k=ArrowUp]{grid-column:2;grid-row:1}.lpad [data-k=ArrowLeft]{grid-column:1;grid-row:2}.lpad [data-k=ArrowRight]{grid-column:3;grid-row:2}.lpad [data-k=ArrowDown]{grid-column:2;grid-row:2}
.lpad .abtn{width:56px;height:56px;border-radius:50%;font:700 24px DMSans,sans-serif;background:#c4531e;color:#fff;box-shadow:0 4px 0 #000}
.lpad .abtn.on{box-shadow:0 1px 0 #000}
.lchat{position:fixed;top:10px;right:10px;z-index:50;font:700 13px JB,monospace;color:#fff8e6;background:#18100a;border:2px solid #000;border-radius:999px;padding:6px 12px;text-decoration:none;box-shadow:2px 2px 0 #c4531e}
</style>
<script>
// Everything above the controller goes into one scroll area, so the controller never covers the game.
(() => { const sc = document.createElement("div"); sc.id = "lscroll"; const pad = document.getElementById("lpad");
  [...document.body.children].filter((el) => el !== pad && el.tagName !== "SCRIPT" && el.tagName !== "STYLE").forEach((el) => sc.append(el));
  document.body.insertBefore(sc, pad); })();
document.querySelectorAll("#lpad button").forEach((b) => {
  const send = (type) => document.body.dispatchEvent(new KeyboardEvent(type, {key: b.dataset.k, code: b.dataset.k === " " ? "Space" : b.dataset.k, bubbles: true}));
  b.addEventListener("pointerdown", (e) => { e.preventDefault(); b.classList.add("on"); send("keydown"); });
  for (const ev of ["pointerup", "pointerleave", "pointercancel"]) b.addEventListener(ev, () => { if (b.classList.contains("on")) { b.classList.remove("on"); send("keyup"); } });
});
// The big screen's keys light the buttons too, so the room sees what's pressed.
for (const t of ["keydown", "keyup"]) document.addEventListener(t, (e) => {
  const k = {w: "ArrowUp", a: "ArrowLeft", s: "ArrowDown", d: "ArrowRight", Enter: " "}[e.key] || e.key;
  const b = document.querySelector(`#lpad button[data-k="${k === " " ? " " : k}"]`); if (b && e.isTrusted === false) b.classList.toggle("on", t === "keydown");
});
</script>
<script src="static/presence.js"></script>
<script>
// Polls the parts once a second; a box changes only when its file's version does. Presence outlines the edit.
const seen = {};
const engine = (h, m) => { const n = {claude: "Claude Code", codex: "Codex", opencode: "OpenCode"}[h] || h || ""; const s = String(m || "").split("/").pop(); return s && h !== "claude" ? `${n} · ${s}` : n; };
async function poll() {
  let d; try { const r = await fetch("api/parts", {cache: "no-store"}); if (!r.ok) return; d = await r.json(); } catch { return; }
  for (const [sid, p] of Object.entries(d.parts)) {
    const el = document.querySelector(`[data-part="${sid}"]`); if (!el) continue;
    if (sid !== "host" && p.wolt) {
      const nm = el.querySelector(".nm"), label = `${p.wolt} · ${p.player}'s wolt · ${engine(p.harness, p.model)}`;
      if (nm.textContent !== label) { nm.innerHTML = ""; const b = document.createElement("b"); b.textContent = p.wolt; nm.append(b, ` · ${p.player}'s wolt · ${engine(p.harness, p.model)}`); }
    }
    const body = el.querySelector(".part-body"); if (!("orig" in el.dataset)) el.dataset.orig = body.innerHTML;
    // Nothing in this box (before the game, or after a reset): back to its placeholder (or hidden on the phone).
    if (!p.v || !p.html) { if (seen[sid]) { body.innerHTML = el.dataset.orig; delete seen[sid]; } el.classList.toggle("empty", sid !== "host"); continue; }
    el.classList.remove("empty");
    if (seen[sid] === p.v) continue;
    seen[sid] = p.v;
    Presence.apply(el, p.html, {name: p.wolt || "commie", slot: sid});
    clearTimeout(el._t); el._t = setTimeout(() => delete el.dataset.editing, 1500);
  }
}
poll(); setInterval(poll, 1000);
</script>
</body>
</html>
