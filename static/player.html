<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lodge Show · player</title>
<link rel="stylesheet" href="../static/show.css">
<style>
html,body{background:var(--cream);color:var(--ink);font:17px/1.45 DMSans,system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:18px 16px calc(120px + env(safe-area-inset-bottom));min-height:100vh}
h1{font:400 30px/1.15 Preahvihear;margin:0 0 6px}
.tag{display:inline-block;font:700 13px JB;color:#fff;background:var(--m);border:2px solid var(--ink);border-radius:6px;padding:1px 8px;margin-bottom:10px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:2px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink)}
form{padding:16px;display:grid;gap:10px}
label{font-weight:700;font-size:15px}
input,textarea{width:100%;font:17px DMSans,system-ui;padding:12px;border:2px solid var(--ink);border-radius:10px;background:#fff;color:var(--ink)}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pick button{background:#fff;color:var(--ink);box-shadow:3px 3px 0 var(--ink);display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;font:700 14px JB}
.pick button.on{background:var(--m);color:#fff;outline:3px solid var(--ink)}
button{font:600 17px DMSans,system-ui;background:var(--org);color:#fff;border:2px solid var(--ink);border-radius:10px;box-shadow:3px 3px 0 var(--ink);padding:12px 18px;cursor:pointer}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
button:disabled{opacity:.5}
.err{color:var(--org);font-weight:700;min-height:1.3em}
.me{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:14px;box-shadow:4px 4px 0 var(--m)}
.me .nm{font:400 26px/1 Preahvihear}.me .hs{font:700 13px JB;color:var(--m)}
.me .live{margin-left:auto;white-space:nowrap;font:700 12px JB;color:var(--ok)}.me .live:before{content:"● ";animation:blink 1.2s infinite}
.msgs{display:flex;flex-direction:column;gap:10px}
.lodge{display:flex;flex-direction:column;gap:9px;background:#1a120c;border:3px solid var(--ink);border-radius:14px;padding:12px 10px;box-shadow:4px 4px 0 var(--ink)}
.lodge .sys{align-self:center;font:700 11px JB;color:#c9b59a;border:1.5px dashed #5a3a22;border-radius:8px;padding:2px 9px;text-transform:uppercase;letter-spacing:.5px}
.lm{display:flex;gap:8px;align-items:flex-start}
.lm .ic{width:26px;flex:0 0 26px;display:flex;justify-content:center;font-size:20px;line-height:1.2}
.lm>div{min-width:0}
.lm .who{font:700 11px JB;color:var(--m);text-transform:uppercase;margin:0 0 2px}
.lm .bb{font:14px/1.38 DMSans;background:#0d0909;color:#fff3dc;border:1.5px solid #000;border-left:4px solid var(--m);border-radius:8px;padding:6px 9px;word-break:break-word}
.lm.h .bb{background:#2a2010;color:#ffe9b8}
.lm.mine .bb{background:var(--m);color:#fff;border-color:var(--ink)}
.lm.mywolt .bb{box-shadow:0 0 0 2px var(--m)}
.lm.forme .bb{outline:2px solid #ffc23d}
.lm .bb b.at{color:#ffc23d}.lm .bb b.atme{background:#ffc23d;color:#18100a;padding:0 3px;border-radius:4px}
.grp{font:700 12px JB;color:var(--muted);text-align:center;margin:4px 0 10px;letter-spacing:.5px}
.m .bb b.at{color:var(--org)}.m .bb b.atme{background:#ffc23d;color:var(--ink);padding:0 3px;border-radius:4px}
.m.mywolt .bb{border-width:3px;box-shadow:3px 3px 0 var(--m),0 0 0 3px color-mix(in srgb,var(--m) 25%,transparent)}
.m:not(.mine):not(.mywolt):not(.forme) .bb{opacity:.82}
.m{max-width:86%;animation:pop .3s ease-out}
.m .who{font:700 12px JB;color:var(--muted);margin:0 6px 2px}
.m .bb{background:#fff;border:2px solid var(--ink);border-radius:14px 14px 14px 4px;padding:8px 12px;box-shadow:3px 3px 0 var(--m);white-space:pre-wrap;word-break:break-word}
.m.mine{align-self:flex-end;text-align:right}.m.mine .bb{background:var(--m);color:#fff;border-radius:14px 14px 4px 14px;box-shadow:3px 3px 0 var(--ink);text-align:left}
.hint{font:13px JB;color:var(--muted);text-align:center;margin:16px 0 0}
.waking{text-align:center;padding:30px 10px;font:700 15px JB;color:var(--muted)}
.waking .av{animation:hop .9s infinite}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--cream);border-top:2px solid var(--ink);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar form{max-width:520px;margin:0 auto;padding:0;display:flex;gap:8px;align-items:flex-end}
.bar textarea{min-height:48px;max-height:40vh;resize:none;padding:11px;font-size:16px;line-height:1.35;overflow-y:auto}
.bar .count{position:absolute;right:110px;top:-20px;font:700 11px JB;color:var(--muted)}.bar{position:fixed}
.bar button{flex:none}
.taken{padding:22px;text-align:center}
.skipb{display:block;width:100%;margin:0 0 14px;padding:10px;font:700 16px JB;background:#fff;border:3px solid var(--ink);border-radius:12px;box-shadow:3px 3px 0 var(--ink)}
.startg{display:block;width:100%;margin:0 0 14px;padding:16px;font:700 20px JB;color:#fff;background:var(--org);border:3px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink)}
.paused.go{background:#4ee06a}
.paused{background:#ffc23d;border:2px solid var(--ink);border-radius:12px;box-shadow:3px 3px 0 var(--ink);padding:10px 14px;font:700 14px JB;text-align:center;margin:0 0 14px}
</style>
</head>
<body>
<main id="app"></main>
<div class="bar" id="bar" hidden>
  <form id="sayf"><textarea id="say" maxlength="800" rows="1" enterkeyhint="enter" placeholder="tell your wolt what to build…"></textarea><button id="send">Send</button></form><span class="count" id="count" hidden></span>
</div>
<script src="../static/sprites.js?v=2"></script>
<script src="../static/player.js?v=14"></script>
</body>
</html>
