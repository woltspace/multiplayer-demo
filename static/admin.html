<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lodge Show · admin</title>
<link rel="stylesheet" href="static/show.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
html,body{background:var(--cream);color:var(--ink);font:16px/1.45 DMSans,system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:22px 16px 60px}
h1{font:400 32px Preahvihear;margin:0 0 4px}.sub{color:var(--muted);margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.slot{background:var(--card);border:2px solid var(--ink);border-radius:14px;box-shadow:5px 5px 0 var(--m);padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.slot h2{font:400 26px Preahvihear;margin:0}
.qr{background:#fff;padding:12px;border:2px solid var(--ink);border-radius:10px}
.st{font:700 13px JB;color:var(--muted)}.st.on{color:var(--ok)}
.url{font:12px JB;color:var(--muted);word-break:break-all;text-align:center}
button{font:600 15px DMSans;background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:10px;box-shadow:3px 3px 0 var(--ink);padding:8px 14px;cursor:pointer}
.lbl{font:400 24px Preahvihear;margin:30px 0 12px}
.show{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--card);border:2px solid var(--ink);border-radius:14px;box-shadow:5px 5px 0 var(--ink);padding:14px;margin:0 0 18px}
.ph{font:700 14px JB;border:2px solid var(--ink);border-radius:8px;padding:4px 10px;background:#f3e6c9}
.ph.live{background:var(--ok);color:#fff}.ph.paused{background:#ffc23d}
button:disabled{opacity:.4;cursor:default}
button.go{background:var(--ok);color:#fff}button.danger{background:#fff;color:#b3261e;border-color:#b3261e;box-shadow:3px 3px 0 #b3261e}
.msg{font:700 13px JB;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 18px}
a.b{display:inline-block;font:600 15px DMSans;background:var(--org);color:#fff;border:2px solid var(--ink);border-radius:10px;box-shadow:3px 3px 0 var(--ink);padding:8px 14px;text-decoration:none}
@media print{.row,button,.sub{display:none}.slot{box-shadow:none;break-inside:avoid}}
</style>
</head>
<body>
<main>
  <h1>Lodge Show · backstage</h1>
  <p class="sub">Print the two player QRs (or show one on your laptop). Each QR works for the first phone only. Reset = a new QR, the old one stops working.</p>
  <div class="show card-ish"><span class="ph" id="ph">…</span>
    <button class="go" id="start">▶ Start the show</button><button id="stop">⏸ Stop (pause screen)</button><button class="danger" id="resetall">↺ Reset everything</button>
    <span class="msg" id="msg" role="status"></span></div>
  <div class="row"><a class="b" id="crowd" href="#">Open the crowd screen ↗</a><button onclick="print()">Print QRs</button><button id="mock" hidden>Restart mock show</button></div>
  <div class="grid" id="grid"></div>
  <h2 class="lbl">Everyone in the room</h2>
  <div class="grid"><div class="slot" data-c="host" id="room"><h2>Room (public)</h2><div class=qr id="room-qr"></div><div class=st>no key: the chat and the build only</div><div class=url id="room-url"></div><a class="b" id="room-open" target="_blank">Open the room ↗</a></div></div>
</main>
<script>
const KEY = new URLSearchParams(location.search).get("k") || "", H = {"X-Admin-Key": KEY};
document.getElementById("crowd").href = "crowd?k=" + encodeURIComponent(KEY);
async function load() {
  const d = await (await fetch("api/admin", {headers: H, cache: "no-store"})).json();
  phase(d.phase);
  const m = document.getElementById("mock"); m.hidden = d.mode !== "mock";
  m.onclick = async () => { await fetch("api/mock/start", {method: "POST", headers: H}); };
  const grid = document.getElementById("grid"), key = JSON.stringify(d.slots);
  if (grid._key === key) return; grid._key = key; grid.innerHTML = "";  // redraw the QRs only when a slot changed
  for (const s of d.slots) {
    const url = new URL("p/" + s.token, location.href).href;
    const el = document.createElement("div"); el.className = "slot"; el.dataset.c = s.slot;
    el.innerHTML = `<h2>${s.label}</h2><div class=qr></div>
      <div class="st${s.claimed ? " on" : ""}">${s.claimed ? "claimed" : "not scanned yet"}${s.wolt ? " · wolt: " + s.wolt : ""}${s.slot === "host" ? " · your slot" : ""}</div>
      <div class=url>${url}</div><button>Reset (new QR)</button>`;
    new QRCode(el.querySelector(".qr"), {text: url, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M});
    el.querySelector("button").onclick = async () => { if (confirm("New QR for " + s.label + "? The old one stops working.")) { await fetch("api/admin/reset/" + s.slot, {method: "POST", headers: H}); load(); } };
    grid.append(el);
  }
}
const PH = {ready: "not started · the big screen shows “starting soon”", live: "● live", paused: "⏸ paused · pause screen is up"};
function phase(p) {
  const el = document.getElementById("ph"); el.textContent = PH[p] || p; el.className = "ph " + p;
  document.getElementById("start").textContent = p === "paused" ? "▶ Resume the show" : "▶ Start the show";
  document.getElementById("start").disabled = p === "live"; document.getElementById("stop").disabled = p !== "live";
}
async function act(path, msg) {
  const m = document.getElementById("msg"); m.textContent = msg;
  const r = await fetch(path, {method: "POST", headers: H});
  const d = await r.json().catch(() => ({}));
  m.textContent = r.ok ? "" : (d.detail || "that didn't work");
  load();
}
document.getElementById("start").onclick = () => act("api/admin/phase/live", "starting…");
document.getElementById("stop").onclick = () => act("api/admin/phase/paused", "pausing…");
document.getElementById("resetall").onclick = () => {
  if (!confirm("Reset everything?\n\nStops every session, deletes the players' wolts, clears the chat and the page, makes new QR codes for all 3 slots and starts a fresh commie.")) return;
  if (!confirm("Sure? The QR codes you printed or sent stop working.")) return;
  act("api/admin/reset-all", "resetting… (commie takes a few seconds to wake up)");
};
load(); setInterval(load, 3000);
const room = new URL(".", location.href).href;
document.getElementById("room-url").textContent = room; document.getElementById("room-open").href = room;
new QRCode(document.getElementById("room-qr"), {text: room, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M});
</script>
</body>
</html>
