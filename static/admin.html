<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lodge Show · admin</title>
<link rel="stylesheet" href="static/show.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
html,body{background:var(--cream);color:var(--ink);font:16px/1.45 DMSans,system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:22px 16px 60px}
h1{font:400 32px Preahvihear;margin:0 0 4px}.sub{color:var(--muted);margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.slot{background:var(--card);border:2px solid var(--ink);border-radius:14px;box-shadow:5px 5px 0 var(--m);padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.slot h2{font:400 26px Preahvihear;margin:0}
.qr{background:#fff;padding:12px;border:2px solid var(--ink);border-radius:10px}
.st{font:700 13px JB;color:var(--muted)}.st.on{color:var(--ok)}
.url{display:block;font:12px JB;color:var(--muted);word-break:break-all;text-align:center}a.url{text-decoration:underline}a.url:hover{color:var(--ink)}
button{font:600 15px DMSans;background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:10px;box-shadow:3px 3px 0 var(--ink);padding:8px 14px;cursor:pointer}
.lbl{font:400 24px Preahvihear;margin:30px 0 12px}
.show{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--card);border:2px solid var(--ink);border-radius:14px;box-shadow:5px 5px 0 var(--ink);padding:14px;margin:0 0 18px}
.ph{font:700 14px JB;border:2px solid var(--ink);border-radius:8px;padding:4px 10px;background:#f3e6c9}
.ph.live{background:var(--ok);color:#fff}.ph.paused{background:#ffc23d}
button:disabled{opacity:.4;cursor:default}
button.go{background:var(--ok);color:#fff}button.danger{background:#fff;color:#b3261e;border-color:#b3261e;box-shadow:3px 3px 0 #b3261e}
.msg{font:700 13px JB;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 18px}
a.b{display:inline-block;font:600 15px DMSans;background:var(--org);color:#fff;border:2px solid var(--ink);border-radius:10px;box-shadow:3px 3px 0 var(--ink);padding:8px 14px;text-decoration:none}
@media print{.row,button,.sub{display:none}.slot{box-shadow:none;break-inside:avoid}}
</style>
</head>
<body>
<main>
  <h1>Lodge Show · backstage</h1>
  <p class="sub">In show order, left to right. Show each QR only to its player: the link is their key (Reset gives a new one).</p>
  <div class="show card-ish"><span class="ph" id="ph">…</span>
    <button class="danger" id="resetall">↺ Reset everything</button><button class="danger" id="kill">⛔ Kill switch</button>
    <span class="msg" id="msg" role="status"></span></div>
  <div class="show card-ish"><span class="ph" id="pub">checking the public address…</span>
    <button id="pubon">🌍 Make public</button><button id="puboff">🔒 Make private</button>
    <span class="msg" id="pubmsg" role="status"></span></div>
  <div class="row"><a class="b" id="world" href="#" target="_blank" rel="noopener">Open the big screen ↗</a> <a class="b" href="slides" target="_blank" rel="noopener">Open the slides ↗</a></div>
  <div class="grid" id="grid"></div>
</main>
<script>
const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));  // player and wolt names are typed by players
const KEY = new URLSearchParams(location.search).get("k") || "", H = {"X-Admin-Key": KEY};
document.getElementById("world").href = "world";  // read-only, no key in the URL (safe to project)
async function load() {
  const d = await (await fetch("api/admin", {headers: H, cache: "no-store"})).json();
  phase(d.phase, d.game);
  const grid = document.getElementById("grid"), key = JSON.stringify(d.slots);
  if (grid._key === key) return; grid._key = key; grid.innerHTML = "";  // redraw the QRs only when a slot changed
  for (const s of d.slots.filter((x) => x.slot !== "host")) {  // the host types from the big screen: no QR needed
    const url = new URL("p/" + s.token, location.href).href;
    const el = document.createElement("div"); el.className = "slot"; el.dataset.c = s.slot;
    el.innerHTML = `<h2>${s.label}</h2><div class=qr></div>
      <div class="st${s.claimed ? " on" : ""}">${s.claimed ? (s.wolt ? "taken" : "creating a wolt…") : "open"}${s.player ? " · player: " + esc(s.player) : ""}${s.wolt ? " · wolt: " + esc(s.wolt) : ""}${s.slot === "host" ? " · your slot" : ""}</div>
      <a class=url href="${url}" target="_blank" rel="noopener">${url}</a><button>Reset (new QR)</button>`;
    new QRCode(el.querySelector(".qr"), {text: url, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M});
    el.querySelector("button").onclick = async () => { if (confirm("New QR for " + s.label + "? The old one stops working.")) { await fetch("api/admin/reset/" + s.slot, {method: "POST", headers: H}); load(); } };
    grid.append(el);
  }
}
// Outer game only. The game itself (start, pause/resume, skip) is run from the big screen.
const PH = {ready: "start screen · press ▶ START on the big screen", live: "● playing", paused: "⏸ paused"};
function phase(p, on) {
  const el = document.getElementById("ph"); el.className = "ph " + p;
  el.textContent = p === "paused" && !on ? "⛔ stopped (kill switch) · reset to start over"
    : p === "live" && !on ? "● open · players joining · ⚡ start the game on the big screen" : PH[p] || p;
}
async function act(path, msg) {
  const m = document.getElementById("msg"); m.textContent = msg;
  const r = await fetch(path, {method: "POST", headers: H});
  const d = await r.json().catch(() => ({}));
  m.textContent = r.ok ? "" : (d.detail || "that didn't work");
  load();
}
document.getElementById("kill").onclick = () => {
  if (!confirm("Kill switch?\n\nStops every wolt now, freezes the game on screen and locks the players' phones. Nothing is deleted: Reset everything starts a fresh show.")) return;
  act("api/admin/kill", "stopping everything…");
};
document.getElementById("resetall").onclick = () => {
  if (!confirm("Reset everything?\n\nStops every session, deletes the players' wolts, clears the chat and the page, makes new QR codes for all 3 slots and starts a fresh hostie.")) return;
  if (!confirm("Sure? The QR codes you printed or sent stop working.")) return;
  act("api/admin/reset-all", "resetting… (hostie takes a few seconds to wake up)");
};
// Public / private: the game (/) and the seats. Backstage, the big screen and the slides stay owner-only either way.
async function pub(path, msg) {
  const m = document.getElementById("pubmsg"); m.textContent = msg || "";
  const r = await fetch("api/admin/public" + (path || ""), {method: path ? "POST" : "GET", headers: H, cache: "no-store"});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { m.textContent = d.detail || "that didn't work"; return; }
  m.textContent = "";
  const el = document.getElementById("pub");
  el.textContent = d.public ? "🌍 PUBLIC · anyone can open the game (and the seat links)" : d.gated ? "🔒 private · your login only" : "no public address set up";
  el.className = "ph " + (d.public ? "live" : "paused");
  document.getElementById("pubon").disabled = !!d.public || !d.gated; document.getElementById("puboff").disabled = !d.public;
}
document.getElementById("pubon").onclick = () => {
  if (!confirm("Make it public?\n\nAnyone can open the game at the main link, and the seat links work. Backstage, the big screen and the slides stay yours only.")) return;
  pub("/on", "opening… (Cloudflare takes a few seconds)");
};
document.getElementById("puboff").onclick = () => pub("/off", "closing…");
pub(); setInterval(pub, 20000);
load(); setInterval(load, 3000);
</script>
</body>
</html>
