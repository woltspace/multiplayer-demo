<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lodge Show · world</title>
<link rel="stylesheet" href="static/show.css">
<style>
/* The big screen for the shared world: three humans and three wolts build one page together. The #lodge group chat on
   the left, the woltPhone (the shared page) in the middle, the three wolts' live terminals on the right. */
@font-face{font-family:Pixel;src:url(static/PressStart2P.woff2)}@font-face{font-family:VT;src:url(static/VT323.woff2)}
:root{--glow:#ff8a3d;--neon:#ffc23d;--cream2:#fff3dc;--tan:#c9b59a;--panel:#16101a;--p1:#5cb85c;--p2:#4a90d9;--host:#ff8a3d}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes coin{0%,49%{opacity:1}50%,100%{opacity:0}}
html,body{height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#22121c 0,#0b0710 70%),#0b0710;color:var(--cream2);font-family:DMSans,system-ui}
.stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;transform:translate(-50%,-50%) scale(var(--s,1))}
/* top strip: title, the host's latest line, the room's QR */
.top{height:96px;display:flex;align-items:center;gap:22px;padding:0 30px;border-bottom:4px solid var(--glow);background:#000}
.top .t{font:400 26px Pixel;color:var(--glow);text-shadow:3px 3px 0 #3a1a08;white-space:nowrap}
.host{flex:1;min-width:0;display:flex;align-items:center;gap:12px;border:2px dashed #5a3a22;padding:8px 14px;font:400 24px VT;color:var(--tan);text-transform:uppercase;letter-spacing:1px}
.host b{color:var(--cream2);font-weight:400;white-space:nowrap}
.host .msg{color:var(--cream2);text-transform:none;letter-spacing:0;font:15px/1.3 JB;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.host .tag{color:#000;background:var(--glow);padding:2px 8px;font:400 20px VT;white-space:nowrap}
.host .tag.ship{background:var(--neon)}
.qr{display:flex;align-items:center;gap:12px;font:400 20px VT;color:var(--neon);text-transform:uppercase;white-space:nowrap}
/* the one public link, big, at the foot of the chat: readable from the back of the room, so people can type it */
.join{flex:none;display:grid;grid-template-columns:150px 1fr;column-gap:18px;row-gap:8px;align-items:center;padding:16px 16px 12px;border-top:4px solid var(--glow);background:#000}
#jqr{background:#fff;padding:6px;line-height:0;box-shadow:5px 5px 0 #c4531e}
.join .jt b{display:block;font:400 22px Pixel;color:#fff;margin-bottom:10px}
.join .jt span{font:400 24px VT;color:var(--tan);text-transform:uppercase;letter-spacing:1px}
.join .jurl{grid-column:1/-1;font:400 44px/1 VT;color:#ffca4e;letter-spacing:1px;white-space:nowrap}
/* the build clock, from ⚡ Start the game: neon, red for the last 30 seconds, TIME! at zero */
.clock{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 16px;border:3px solid var(--neon);background:#000;min-width:190px}
.clock[hidden]{display:none}.clock small{font:400 16px VT;color:var(--tan);letter-spacing:2px;text-transform:uppercase}
.clock b{font:400 34px Pixel;color:var(--neon);font-weight:400}
.clock.late{border-color:#ff5a4a}.clock.late b{color:#ff5a4a}
.clock.held{border-color:#ffca4e}.clock.held b{color:#ffca4e;animation:breathe 2s ease-in-out infinite}
.pausebtn{flex:none;font:400 18px Pixel;color:#fff;background:#3a2a20;border:3px solid #ffca4e;padding:14px 18px;cursor:pointer;box-shadow:4px 4px 0 #000}
.pausebtn.go{background:#c4531e;border-color:#fff;animation:startglow 1.6s ease-in-out infinite alternate}.pausebtn[hidden]{display:none}.resetbtn{flex:none;font:400 26px VT;color:var(--tan);background:transparent;border:2px solid #5a4a40;padding:6px 12px;cursor:pointer}.resetbtn:hover{color:#fff;border-color:#ff5a4a}.resetbtn:disabled{opacity:.5}.resetbtn[hidden]{display:none}.pausebtn:hover{background:#5a3a24}.pausebtn.on{background:#c4531e;border-color:#fff}.pausebtn:disabled{opacity:.6;cursor:default}
/* the shared world: #lodge chat left, the woltPhone in the middle, the three terminals right */
.turns{flex:1;min-width:0;display:flex;align-items:center;gap:12px;font:400 22px VT;color:var(--tan);text-transform:uppercase;letter-spacing:1px}
.turn{display:flex;align-items:center;gap:8px;padding:6px 12px;border:2px solid #2a2030;color:#7a6a5c;white-space:nowrap}
.turn.now{border-color:var(--m);color:#000;background:var(--m);box-shadow:0 0 18px var(--m)}
.turn.busy{animation:breathe 2s ease-in-out infinite}
.turns .arrow{color:#5a4a40}
.turns .skip{margin-left:auto;flex:none;font:400 20px VT;letter-spacing:1px;text-transform:uppercase;color:var(--tan);background:transparent;border:2px solid #5a4a40;padding:4px 12px;cursor:pointer}.turns .skip:hover{color:#fff;border-color:#ff8a3d}
.main{display:grid;grid-template-columns:560px 1fr 620px;gap:24px;padding:22px 26px;height:calc(1080px - 96px)}
.box{border:4px solid #000;box-shadow:0 0 0 4px var(--m,var(--glow)),0 0 30px color-mix(in srgb,var(--m,var(--glow)) 35%,transparent);background:var(--panel);display:flex;flex-direction:column;min-height:0;min-width:0}
.bh{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#000;border-bottom:4px solid var(--m,var(--glow));font:400 20px VT;text-transform:uppercase;letter-spacing:1px;color:var(--m,var(--glow));white-space:nowrap;overflow:hidden}
.bh b{font:400 16px Pixel;font-weight:400}.bh .r{margin-left:auto;color:#8a7258}
.bh .dot{width:10px;height:10px;background:#45c25a;display:inline-block}.bh .dot.busy{animation:breathe 1.6s ease-in-out infinite}
.chat{flex:1;display:flex;flex-direction:column;gap:10px;padding:14px;background:color-mix(in srgb,var(--glow) 8%,#140e10);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--glow) transparent;min-height:0;
 -webkit-mask-image:linear-gradient(transparent 0,#000 40px);mask-image:linear-gradient(transparent 0,#000 40px)}
/* #lodge, Slack-thread style: avatar left, name line (name · HUMAN/WOLT · time), message below. Seat colors. */
.chat>:first-child{margin-top:auto}
.cm{display:grid;grid-template-columns:36px 1fr;column-gap:12px;row-gap:2px;flex:none;padding:6px 8px 6px 6px;border-left:4px solid transparent}
.cm .ic{grid-row:1/3;display:flex;align-items:flex-start;justify-content:center;padding-top:2px;font-size:26px;line-height:1}
.cm .hd{display:flex;align-items:baseline;gap:8px;line-height:1.1;min-width:0}
.cm .who{font:400 21px VT;color:var(--m);text-transform:uppercase;letter-spacing:1px;white-space:nowrap}
.cm .tag{font:400 14px VT;text-transform:uppercase;letter-spacing:1px;padding:0 5px;border:1px solid currentColor;align-self:center}
.cm.h .tag{color:#120a06;background:var(--m);border-color:var(--m)}.cm.w .tag{color:var(--m)}
.cm .tm{font:400 15px VT;color:#7a6a5c;letter-spacing:1px}
.cm .bb{font:16px/1.42 JB;color:var(--cream2);overflow-wrap:anywhere;min-width:0}
.cm.h{background:color-mix(in srgb,var(--m) 10%,transparent);border-left-color:var(--m)}
.cm.h .bb{color:#fff3dc;font-weight:600}
.cm .bb b{color:var(--neon);font-weight:700}
.cm.at .bb b{text-shadow:0 0 8px color-mix(in srgb,var(--neon) 60%,transparent)}
.sys{align-self:center;flex:none;font:400 18px VT;color:var(--tan);border:2px dashed #5a3a22;padding:3px 12px;text-transform:uppercase;letter-spacing:1px;text-align:center}
.sys.go{color:#000;background:var(--neon);border-color:var(--neon)}
.world{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0}
.wtitle{font:400 18px Pixel;color:var(--neon);letter-spacing:1px}
.phone{position:relative;width:399px;height:850px;flex:none;transform:scale(.98);transform-origin:top center;background:#111;border-radius:52px;padding:12px 12px 58px;
 box-shadow:0 0 0 3px #2a2a2a,0 0 0 6px var(--glow),0 0 60px #ff8a3d55,0 24px 60px #000c}
.phone .screen{position:relative;width:375px;height:780px;background:#fff8e6;border-radius:40px;overflow:hidden}
.phone .screen::before{content:"";position:absolute;top:10px;left:50%;width:110px;height:30px;margin-left:-55px;background:#111;border-radius:16px;z-index:2}
.phone iframe{position:absolute;left:0;top:0;width:375px;height:780px;border:0}
.phone .brand{position:absolute;left:0;right:0;bottom:12px;display:flex;align-items:center;justify-content:center;gap:10px;font:400 18px Pixel;color:#d8d0c4;letter-spacing:2px}
.phone .brand b{font-weight:400;color:var(--glow)}
.terms{display:flex;flex-direction:column;gap:16px;min-height:0}
/* the type box is a real input, kept out of sight: what you type shows on the terminal's own ❯ prompt line */
.say{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.draft.idle{opacity:.45}
.tb pre .pline{color:#fff3dc;background:color-mix(in srgb,var(--m,var(--glow)) 16%,transparent)}
.tb pre .pline .caret,.draft .caret{display:inline-block;width:.55em;height:1em;vertical-align:-.15em;background:#fff3dc;margin-left:2px;animation:coin 1s steps(1) infinite}
.tb pre .terr{display:block;color:#ff8a6a}
section.term:focus-within,section.term.typing{outline:3px solid #fff3dc}
.tb pre .rl{display:block;white-space:pre;overflow:hidden}section.term:not(.empty){cursor:text}.say[hidden]{display:none}.say span{color:var(--m,var(--glow))}
.say input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#fff3dc;font:14px JB}.say input::placeholder{color:#6a5a50}
.say em{font:normal 13px JB;color:#ff8a6a;white-space:nowrap}
.term{flex:1;position:relative}
.term .turnarrow{position:absolute;left:-132px;width:118px;top:50%;margin-top:-44px;display:flex;flex-direction:column;align-items:center;gap:6px;font:normal 52px/1 Pixel;color:var(--m,var(--glow));text-shadow:0 0 12px var(--m,var(--glow)),3px 3px 0 #000;animation:turnflash .8s steps(1) infinite,turnnudge .8s ease-in-out infinite;z-index:3}
.term .turnarrow b{font:normal 20px Pixel;letter-spacing:2px}
.term.now{box-shadow:0 0 0 4px var(--m,var(--glow)),0 0 50px var(--m,var(--glow))}
@keyframes turnflash{50%{opacity:.25}}@keyframes turnnudge{50%{translate:8px 0}}
.tb{flex:1;position:relative;background:#050307;overflow:hidden;min-height:0}
.tb pre{margin:0;position:absolute;left:0;right:0;bottom:0;padding:8px 12px;font:12.5px/1.38 JB,monospace;color:#d8d0c4;white-space:pre-wrap;word-break:break-word}
.draft{display:block;margin-top:4px;padding:4px 8px;background:color-mix(in srgb,var(--m) 22%,#000);border-left:4px solid var(--m);color:#fff3dc;font-size:14px}
.draft b{color:var(--m)}.draft .caret{display:inline-block;width:.55em;height:1em;vertical-align:-.15em;background:#fff3dc;margin-left:2px;animation:coin 1s steps(1) infinite}
.term.empty{align-items:center;justify-content:center;gap:10px;background:transparent;box-shadow:none;border:4px dashed color-mix(in srgb,var(--m) 60%,#000)}
.term.empty .big{font:400 20px Pixel;color:var(--m);animation:breathe 3s ease-in-out infinite;text-align:center;line-height:1.6}
.term.empty span{font:400 22px VT;color:var(--tan);text-transform:uppercase;letter-spacing:2px}
/* the board: the game's start screen (the slides are their own deck, /slides) */
.start{display:flex;flex-direction:column;align-items:center;gap:28px;text-align:center}
.start .k{font:400 22px Pixel;color:var(--amber,#ffca4e);letter-spacing:4px}
.start h2{margin:0;font:400 clamp(60px,9vw,150px)/1 Pixel;color:#ff8a3d;text-shadow:6px 6px 0 #4a1a08}
.start .sub{font:400 34px VT;color:#e8dccb;letter-spacing:2px}
.start .scan{display:flex;align-items:center;gap:28px;margin-top:20px}
.start #bqr{background:#fff;padding:10px;line-height:0;box-shadow:8px 8px 0 #c4531e}
.start .go{font:400 30px Pixel;color:#fff;animation:pressstart 1.1s steps(1) infinite}
.start .url{font:400 30px VT;color:#ffca4e;margin-top:10px}
@keyframes pressstart{50%{opacity:0}}
/* the corner: the one public link, for the crowd's phones */
.curtain .watch{position:absolute;right:40px;bottom:30px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.curtain .watch #bqr{background:#fff;padding:8px;line-height:0;box-shadow:6px 6px 0 #c4531e}
.curtain .watch b{display:block;font:400 18px Pixel;color:#fff;margin:8px 0 8px}
.curtain .watch span{font:400 30px VT;color:#ffca4e}
/* the start button: a real button, breathing with a smooth glow (no blinking) */
.start .startb{margin-top:56px;font:400 clamp(26px,2.6vw,42px) Pixel;color:#fff;background:#c4531e;border:5px solid #18100a;padding:22px 40px;cursor:pointer;text-shadow:3px 3px 0 #6a2a0e;box-shadow:8px 8px 0 #18100a,0 0 24px #ff8a3d88;animation:startglow 1.6s ease-in-out infinite alternate}
@keyframes startglow{from{scale:1;box-shadow:8px 8px 0 #18100a,0 0 8px #ff8a3d33}to{scale:1.04;box-shadow:8px 8px 0 #18100a,0 0 30px #ff8a3d,0 0 70px #ffca4e77}}
.start .startb:hover{background:#e0682c}.start .startb:active{translate:4px 4px;box-shadow:4px 4px 0 #18100a}.start .startb:disabled{animation:none;opacity:.6}
/* the start screen, after a reset (phase ready) */
.curtain{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#2a1420 0,#0b0710 75%)}
.curtain[hidden]{display:none}
.cbox{display:flex;align-items:center;justify-content:space-between;gap:80px;width:1560px;min-height:600px;background:var(--panel);border:6px solid #000;box-shadow:0 0 0 6px var(--glow),0 0 0 12px #000,0 0 80px #ff8a3d55;padding:60px 80px}
.ccard{flex:1;min-width:0;transition:opacity .8s ease}.ccard.out{opacity:0}
.cbox h1{font:400 60px/1.1 Pixel;color:var(--glow);text-shadow:6px 6px 0 #000,0 0 30px #ff8a3daa;margin:18px 0 10px;white-space:nowrap}
.cbox h1::after{content:"";display:inline-block;width:.6em;height:1em;vertical-align:-.12em;background:currentColor;margin-left:.35em;animation:coin 1s steps(1) infinite}
.cbox p{font:400 30px/1.5 Pixel;color:var(--neon);margin:0;animation:breathe 3s ease-in-out infinite}
.cq{display:flex;flex-direction:column;align-items:center;gap:14px;font:400 24px VT;color:var(--tan);text-transform:uppercase;letter-spacing:1px}
.cq b{font:400 18px Pixel;color:var(--cream2)}
#cqr{background:#fff;padding:14px;border:4px solid var(--neon);line-height:0}
.term.empty .mk{font:400 16px Pixel;color:#000;background:var(--m);border:3px solid #000;box-shadow:4px 4px 0 #000;padding:12px 16px;cursor:pointer}
.term.empty .mk:hover{filter:brightness(1.15)}
dialog.mkd{border:4px solid var(--m,var(--glow));background:var(--panel);color:var(--cream2);padding:26px 30px;width:520px;box-shadow:10px 10px 0 #000}
dialog.mkd::backdrop{background:rgba(0,0,0,.7)}
.mkd h2{margin:0 0 16px;font:400 20px Pixel;color:var(--m,var(--glow));line-height:1.5}
.mkd label{display:block;margin:14px 0 6px;font:400 24px VT;color:var(--tan);text-transform:uppercase;letter-spacing:1px}
.mkd input{width:100%;box-sizing:border-box;font:400 30px VT;padding:8px 12px;background:#000;color:var(--cream2);border:2px solid #5a3a22;outline:none}
.mkd input:focus{border-color:var(--m,var(--glow))}
.mkd .pick{display:flex;gap:10px}.mkd .pick button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px;background:#000;color:var(--tan);border:2px solid #5a3a22;font:400 22px VT;cursor:pointer}
.mkd .pick button.on{border-color:var(--m,var(--glow));color:var(--cream2);background:#241a14}
.mkd .row{display:flex;gap:12px;margin-top:22px;align-items:center}.mkd .err{flex:1;font:400 22px VT;color:#ff8080}
.mkd .row button{font:400 14px Pixel;padding:12px 16px;border:3px solid #000;cursor:pointer}.mkd .go{background:var(--m,var(--glow));color:#000;box-shadow:4px 4px 0 #000}.mkd .no{background:transparent;color:var(--tan);border-color:#5a3a22}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="top">
    <div class="t">Lodge Show</div>
    <div class="turns" id="turns"></div>
    <div class="clock" id="clock" hidden></div>
    <button class="pausebtn" id="pause" hidden>⏸ pause</button>
    <button class="resetbtn" id="replay" title="Instant replay of the build (new tab; Shift: on the woltPhone)" hidden>⏪</button>
    <button class="resetbtn" id="resetall" title="Reset everything">↺</button>
  </div>
  <div class="main">
    <section class="box" data-c="host"><div class="bh"><b>#lodge</b><span id="who">· everyone</span><span class="r">live</span></div><div class="chat" id="chat"></div>
      <div class="join"><div id="jqr"></div><div class="jt"><b>📱 play along</b><span>on your phone: scan, or type</span></div><div class="jurl" id="jurl"></div></div></section>
    <div class="world"><div class="wtitle">★ the woltPhone ★</div>
      <div class="phone"><div class="screen"><iframe sandbox="allow-scripts" title="the woltPhone" src="stage?phone=1"></iframe></div><div class="brand"><span id="wbv"></span><span><b>w</b>Phone</span></div></div></div>
    <div class="terms" id="terms"></div>
  </div>
  <div class="curtain" id="curtain" hidden><div class="start"><div class="k">★ LODGE SHOW ★</div><h2 id="btitle">Dam Builders</h2>
    <div class="sub" id="bsub">3 humans · 3 wolts · 1 game</div>
    <button class="startb" id="bstart">▶ START</button></div>
    <div class="watch"><div id="bqr"></div><div><b>watch it on your phone</b><span id="burl"></span></div></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="static/sprites.js?v=2"></script>
<script src="static/term.js?v=2"></script>
<script src="static/world.js?v=43"></script>
</body>
</html>
